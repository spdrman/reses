name: Release

# Release procedure (used for v0.2.7):
# 1. Inspect the last tag/release and bump the package version in BOTH Cargo.toml and Cargo.lock
#    on a branch from main. Open a version-bump PR. If a fix belongs in this release, verify its
#    PR's "Fixes #issue" is listed under closingIssuesReferences, then merge the fix first; check
#    that the issue closed. Merge the updated main into the version branch so its checks exercise
#    the combined tree. Wait for its push CI and this workflow's PR dry run to pass, then merge
#    the version PR to main.
# 2. Wait for ci.yml's PUSH run on the resulting main merge commit to finish successfully with
#    every job passing. Do not release a PR merge-ref, an earlier branch SHA, or merely a green
#    PR check. Check that v<version> does not already exist.
# 3. Fast-forward the local release branch from origin/release to that exact tested origin/main
#    commit (`git switch release && git merge --ff-only origin/main`), then push release normally
#    (`git push origin release`). Do not create another merge commit on release: that new SHA
#    would not be on main and would not have passed main's push CI. Never force-push release.
# 4. Watch this push workflow finish. The version job refuses an existing tag, a SHA not on main,
#    or absent/failed/skipped ci.yml push jobs on that exact SHA. The release separately runs
#    tests, the MinIO integration suite, and native builds plus goldens for three targets.
#    Publish creates the tag at that SHA, drafts the release, checks all six assets (three
#    archives, two .debs, SHA256SUMS), then makes the release public. On publish failure it
#    removes only the tag/draft created by that run, so investigate before trying again.
# 5. Verify the run, published (not draft) release, tag == tested main == release SHA, all six
#    assets, and an archive's SHA256SUMS checksum and executable version. Only after success,
#    make any process-documentation changes in a separate PR to main; do NOT push a docs-only
#    commit to release at the same version (the existing tag makes the guard reject it).
#
# tests/release_workflow.rs pins the workflow contract; tests/release_version.rs tests the guard.
# Every action is pinned to a full commit SHA: a moved action tag could swap a shipped binary.

on:
  push:
    branches: [release]
  # A PR that changes anything a release run executes or builds from gets a dry run: every
  # build and check, no publish. That includes the source, the lockfile and the tests, since
  # the release builds the one against the other and runs all of the third.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .python-version
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - install.sh
      - scripts/release-version.sh
      - scripts/check-goldens.sh
      - scripts/check-static.sh
      - scripts/place-binary.sh

permissions:
  contents: read

# Never cancel a release halfway through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    # The script reads ci.yml's runs on the commit through the API, which needs `actions:
    # read`. The run's own token does that; it's only ever in the environment.
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The "is this commit on main" check needs history. The repo is public, so reading
          # tags and main needs no token.
          fetch-depth: 0
          persist-credentials: false
      - id: v
        name: Read the version, refuse an existing tag, a commit not on main or one CI didn't pass
        run: scripts/release-version.sh "$GITHUB_EVENT_NAME" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The configparser oracle runs on the Python .python-version pins, as it does in CI.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - run: cargo test --locked --no-fail-fast

  # The S3 client is what the inbox stands on, and only this suite drives it against a real
  # server, so it runs here as it does in ci.yml (tests/release_workflow.rs compares the two).
  integration:
    name: Integration (MinIO)
    runs-on: ubuntu-latest
    env:
      RESES_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      RESES_TEST_S3_ACCESS_KEY: resesadmin
      RESES_TEST_S3_SECRET_KEY: resesadmin-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$RESES_TEST_S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$RESES_TEST_S3_SECRET_KEY" \
            cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 \
            server /tmp/minio-data
          for i in $(seq 1 60); do
            curl -fs -o /dev/null "$RESES_TEST_S3_ENDPOINT/minio/health/live" && exit 0
            sleep 1
          done
          docker logs minio
          echo "::error::MinIO never came up"
          exit 1
      - run: cargo test --locked --no-fail-fast -- --ignored --test-threads=1

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # The Linux binaries are static musl builds, so they run on any distro. ring compiles some
      # C for the target, which needs musl's compiler wrapper.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build (Linux, static musl)
        if: contains(matrix.target, 'musl')
        env:
          TARGET_CC: musl-gcc
        run: cargo build --release --locked --target "$TARGET"
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target "$TARGET"
      # The same staticness check ci.yml's musl job and the local gate run.
      - name: Check the Linux binary is static
        if: contains(matrix.target, 'musl')
        run: scripts/check-static.sh "target/$TARGET/release/reses"
      - run: scripts/check-goldens.sh "target/$TARGET/release/reses"
      # The #15 test itself must pass. Its positive control only warns here: a runner image
      # whose kernel stops reproducing #15 says nothing about this binary, and ci.yml still
      # fails on it, so it gets noticed without stopping a release.
      - name: The #15 replace test
        if: runner.os == 'macOS'
        env:
          RESES_REPLACE_CONTROL: warn
        run: tests/macos-replace-binary.sh "target/$TARGET/release/reses"
      - name: Package
        run: |
          name="reses-v$VERSION-$TARGET"
          mkdir -p "stage/$name"
          cp "target/$TARGET/release/reses" README.md LICENSE "stage/$name/"
          tar -C stage -czf "$name.tar.gz" "$name"
          tar -tzvf "$name.tar.gz"
      # Debian and Ubuntu get a .deb of the same static binary, so apt can install, upgrade and
      # remove it. dpkg-deb is all that takes; the package has no dependencies.
      - name: Package as .deb
        if: contains(matrix.target, 'musl')
        run: |
          case "$TARGET" in x86_64-*) arch=amd64 ;; aarch64-*) arch=arm64 ;; esac
          # A semver prerelease (1.0.0-rc.1) becomes 1.0.0~rc.1, which dpkg sorts before 1.0.0.
          debver="${VERSION/-/~}"
          pkg="reses_${VERSION}_$arch"
          mkdir -p "debroot/$pkg/DEBIAN" "debroot/$pkg/usr/bin" "debroot/$pkg/usr/share/doc/reses"
          install -m 0755 "target/$TARGET/release/reses" "debroot/$pkg/usr/bin/reses"
          install -m 0644 LICENSE "debroot/$pkg/usr/share/doc/reses/copyright"
          printf '%s\n' \
            "Package: reses" \
            "Version: $debver" \
            "Architecture: $arch" \
            "Maintainer: spdrman <https://github.com/spdrman>" \
            "Section: mail" \
            "Priority: optional" \
            "Homepage: https://github.com/spdrman/reses" \
            "Description: terminal inbox for raw SES email stored in S3" \
            " re:SES opens an inbox over the S3 bucket where Amazon SES stores incoming" \
            " mail, and decodes stored messages into a readable form." \
            > "debroot/$pkg/DEBIAN/control"
          # xz rather than the zstd newer dpkg-deb defaults to, so Debian 11 can install it too.
          dpkg-deb -Zxz --root-owner-group --build "debroot/$pkg" "$pkg.deb"
          dpkg-deb --info "$pkg.deb"
      # Install the package the way a user would, then check the installed binary, so a broken
      # package can never be published.
      - name: Install the .deb with apt and check it
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get install -y "$PWD/reses_${VERSION}_$(dpkg --print-architecture).deb"
          reses --version
          scripts/check-goldens.sh /usr/bin/reses
      # The runner's own dpkg is new; install on Debian 11 too, the oldest dpkg the package
      # has to work with.
      - name: Install the .deb on Debian 11
        if: contains(matrix.target, 'musl')
        run: |
          docker run --rm -v "$PWD:/pkg:ro" debian:bullseye sh -c \
            "dpkg -i /pkg/reses_${VERSION}_$(dpkg --print-architecture).deb && reses --version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reses-${{ matrix.target }}
          path: |
            reses-v${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz
            reses_${{ needs.version.outputs.version }}_*.deb
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, test, integration, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: reses-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -l
          [ "$(ls *.tar.gz | wc -l)" -eq 3 ] || { echo "::error::expected 3 archives"; exit 1; }
          [ "$(ls *.deb | wc -l)" -eq 2 ] || { echo "::error::expected 2 debs"; exit 1; }
          sha256sum *.tar.gz *.deb > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: |
          cat > notes.md <<EOF
          Binaries for reses v$VERSION. Each archive holds the \`reses\` binary, the README and the license.

          | File | Platform |
          |---|---|
          | \`reses-v$VERSION-x86_64-unknown-linux-musl.tar.gz\` | Linux x86_64 (amd64), static |
          | \`reses-v$VERSION-aarch64-unknown-linux-musl.tar.gz\` | Linux arm64, static |
          | \`reses-v$VERSION-aarch64-apple-darwin.tar.gz\` | macOS, Apple Silicon |

          **Debian and Ubuntu** (amd64, arm64)

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/spdrman/reses/main/install.sh | sh
          \`\`\`

          The installer checks the \`.deb\` against \`SHA256SUMS\` and installs it with apt, so \`apt remove reses\` uninstalls it. There's no apt repository, so to upgrade, run the same command again. You can also install a downloaded \`reses_${VERSION}_amd64.deb\` or \`reses_${VERSION}_arm64.deb\` directly with \`sudo apt install ./reses_${VERSION}_<arch>.deb\`.

          **macOS**: \`brew install spdrman/reses/reses\`

          **Other Linux**

          \`\`\`
          tar -xzf reses-v$VERSION-x86_64-unknown-linux-musl.tar.gz
          mv reses-v$VERSION-x86_64-unknown-linux-musl/reses ~/.local/bin/
          \`\`\`

          Use the \`aarch64\` archive on arm64.

          **macOS**

          \`\`\`
          tar -xzf reses-v$VERSION-aarch64-apple-darwin.tar.gz
          xattr -d com.apple.quarantine reses-v$VERSION-aarch64-apple-darwin/reses
          mv reses-v$VERSION-aarch64-apple-darwin/reses ~/.local/bin/
          \`\`\`

          The binary is ad-hoc signed, not notarized, so macOS blocks it when it came from a browser download until the quarantine flag is cleared. If you downloaded with \`curl\` there's no flag, and \`xattr\` saying so is harmless. \`~/.local/bin\` isn't on a Mac's PATH by default, so add it or pick another directory. To replace an older copy, \`mv\` the new one over it, never \`cp\` (#15).

          Then run \`reses\` to open the inbox. No file or path is needed.

          Check a download with \`shasum -a 256 -c SHA256SUMS --ignore-missing\`.
          EOF
      # The tag is created first, at exactly this commit. Creating a ref that already exists
      # fails, so a tag made since the version check can't end up with these binaries on it.
      - name: Tag
        id: tag
        run: |
          gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" >/dev/null
          echo "created=true" >> "$GITHUB_OUTPUT"
      # Draft first, check every asset arrived, then publish, so a failed upload never shows up
      # as a release with pieces missing.
      - name: Create the release as a draft
        run: |
          gh release create "v$VERSION" dist/*.tar.gz dist/*.deb dist/SHA256SUMS \
            --verify-tag --draft --title "reses v$VERSION" --notes-file notes.md
      - name: Check the assets and publish
        run: |
          n=$(gh release view "v$VERSION" --json assets --jq '.assets | length')
          [ "$n" -eq 6 ] || { echo "::error::expected 6 assets on the draft, found $n"; exit 1; }
          gh release edit "v$VERSION" --draft=false
      # Only what this run created is removed, so a rerun after fixing the cause starts clean.
      - name: Clean up after a failed publish
        if: failure() && steps.tag.outputs.created == 'true'
        run: |
          gh release delete "v$VERSION" --yes || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/v$VERSION" || true
