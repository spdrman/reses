[package]
name = "reses"
version = "0.2.1"
edition = "2024"
authors = ["Roman Goldmann <roman@devshell.org>"]
rust-version = "1.98"
description = "A terminal inbox for raw SES/RFC 5322 email stored in S3, and a CLI decoder for single messages"
license = "MIT"
repository = "https://github.com/spdrman/reses"

[dependencies]
anyhow = "1"
# The SDK does the S3 work: signing, retries, and credentials from the profile files (static
# keys, session tokens, SSO, assume-role and credential_process). I turn off the default
# features so only one HTTP stack gets built (the hyper 1 client), not the legacy one as well.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
# The profile-file types aws-config itself now points at (its own names for them are deprecated).
aws-runtime = "1"
# aws-types carries the file-set and environment types the profile loader takes, so reses lists
# exactly the profiles the S3 client connects with.
aws-types = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
html2text = "0.17.1"
# reses asks for PNG only: the header logo is the one image it decodes. ratatui-image turns on
# image's jpeg feature regardless, so zune-jpeg and moxcms (colour management) get built too.
# Both are pure Rust and only add build time; I accept that rather than patch the dependency.
image = { version = "0.25", default-features = false, features = ["png"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
# The profile loader is async but never waits when it reads from memory, so a minimal
# executor is all it needs.
pollster = "0.4"
# Saves go through a temp file in the same directory and a rename, so nobody sees half a file.
tempfile = "3"
percent-encoding = "2"
ratatui = "0.29"
# 8.1 is the last release on ratatui 0.29. No default features: they would add image's whole
# default decoder set and the crossterm backend ratatui already brings.
ratatui-image = { version = "8.1", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
# The runtime reses owns, so the S3 calls can stay synchronous for the views.
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
toml = "0.8"

[dev-dependencies]
# A scripted HTTP client for the SDK, so region redirects and odd listings get tested offline.
aws-smithy-http-client = { version = "1", features = ["test-util"] }
# Response bodies for that client, including one that breaks partway, to prove reads stop early.
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
bytes = "1"
http-body = "1"
http = "1"
# tests/tui_pty.rs runs the app on a real pty. 0.38 is the rustix ratatui-image already builds.
rustix = { version = "0.38", features = ["pty", "process", "termios"] }

[profile.release]
strip = true
lto = "thin"
