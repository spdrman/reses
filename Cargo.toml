[package]
name = "reses"
version = "0.2.1"
edition = "2024"
authors = ["Roman Goldmann <roman@devshell.org>"]
rust-version = "1.98"
description = "A terminal inbox for raw SES/RFC 5322 email stored in S3, and a CLI decoder for single messages"
license = "MIT"
repository = "https://github.com/spdrman/reses"

[dependencies]
anyhow = "1"
# reses reads ~/.aws/credentials and ~/.aws/config through the SDK's own profile loader, so it
# sees exactly the profiles the S3 client will connect with. aws-runtime and aws-types carry the
# file-set and environment types that loader takes.
aws-config = { version = "1", default-features = false }
aws-runtime = { version = "1", default-features = false }
aws-types = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
# reses asks for PNG only: the header logo is the one image it decodes. ratatui-image turns on
# image's jpeg feature regardless, so zune-jpeg and moxcms (colour management) get built too.
# Both are pure Rust and only add build time; I accept that rather than patch the dependency.
image = { version = "0.25", default-features = false, features = ["png"] }
mail-parser = "0.11"
# The profile loader is async but never waits when it reads from memory, so a minimal
# executor is all it needs.
pollster = "0.4"
percent-encoding = "2"
quick-xml = { version = "0.37", features = ["serialize"] }
ratatui = "0.29"
# 8.1 is the last release on ratatui 0.29. No default features: they would add image's whole
# default decoder set and the crossterm backend ratatui already brings.
ratatui-image = { version = "8.1", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
toml = "0.8"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
# tests/tui_pty.rs runs the app on a real pty. 0.38 is the rustix ratatui-image already builds.
rustix = { version = "0.38", features = ["pty", "process", "termios"] }
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
